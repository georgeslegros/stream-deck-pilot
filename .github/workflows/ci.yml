name: CI

# Build + full test suite (unit and Testcontainers integration tests) on every PR, on every push
# to master, and as a gate before release.yml publishes an image (called via workflow_call).
on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # Superseded PR pushes are cancelled; master pushes and release gates always run to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    # This name is the required status check on master (branch protection) — keep it stable.
    name: Build and test
    runs-on: ubuntu-latest   # Docker is preinstalled, which the integration tests need
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Key rendering uses system fonts; the container ships DejaVu Sans, so render tests
      # (golden images) run with the same font.
      - name: Install fonts
        run: |
          if ! fc-list | grep -q "DejaVu Sans"; then
            sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Browser for the web UI's Playwright tests (tests/StreamDeckPilot.Web.E2E). E2E_REQUIRED
      # makes a missing browser fail the run instead of skipping the tests, as it does locally.
      - name: Install Playwright browser
        run: pwsh tests/StreamDeckPilot.Web.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        env:
          E2E_REQUIRED: "1"
        run: >-
          dotnet test --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults
          --collect:"XPlat Code Coverage" --settings coverage.runsettings

      # Coverage summary on the run page. On pull requests, coverage-comment.yml also posts it
      # on the PR: this workflow only has read access (it also runs as release.yml's gate).
      - name: Coverage report
        if: ${{ !cancelled() && hashFiles('TestResults/**/coverage.cobertura.xml') != '' }}
        run: |
          dotnet tool restore
          dotnet reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:coverage -reporttypes:"MarkdownSummaryGithub;Cobertura" -verbosity:Warning
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: ${{ !cancelled() && hashFiles('coverage/SummaryGithub.md') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/

  # The container image behind a real Traefik, at the root of a host name and under a path base
  # (#109, docs/reverse-proxy.md). Runs in parallel with the test job.
  reverse-proxy-e2e:
    name: Reverse proxy (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f src/StreamDeckPilot.Api/Dockerfile -t stream-deck-pilot:e2e .

      - name: Start the app behind Traefik
        run: docker compose -f e2e/reverse-proxy/docker-compose.yml up -d

      - name: Smoke checks
        env:
          WS_PATH: /_blazor /hubs/live   # the web UI's circuit and the live events hub: WebSocket upgrades must get 101 through Traefik
        run: e2e/reverse-proxy/smoke.sh

      - name: Container logs
        if: failure()
        run: docker compose -f e2e/reverse-proxy/docker-compose.yml logs --no-color

      - name: Stop
        if: always()
        run: docker compose -f e2e/reverse-proxy/docker-compose.yml down -v
