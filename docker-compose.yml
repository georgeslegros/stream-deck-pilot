services:
  stream-deck-pilot:
    build:
      context: .
      dockerfile: src/StreamDeckPilot.Api/Dockerfile
    environment:
      - ApiKey=${API_KEY:?API_KEY is required}
      - Storage__BaseDirectory=/data
      - Mqtt__Host=${MQTT_HOST:-localhost}
      - Mqtt__Port=${MQTT_PORT:-1883}
      - Mqtt__Username=${MQTT_USERNAME:-}
      - Mqtt__Password=${MQTT_PASSWORD:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4317
    volumes:
      - stream_deck_data:/data
    # Fixed node: only works if it exists at container start and the deck never moves to another
    # hidrawN. For hot-plug / reboot races use a live /dev instead (README "Hot-plug"):
    #   volumes: [ "/dev:/dev" ]  +  device_cgroup_rules: [ 'c <hidraw-major>:* rmw' ]
    devices:
      - /dev/hidraw0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  stream_deck_data:
